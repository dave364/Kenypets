<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">

    <!-- viewport-fit=cover deja que la página llegue hasta los bordes en los
         celulares con muesca. Sin esto, los env(safe-area-inset-*) que usa el
         carrito y los modales valen 0 y no hacen nada.
         interactive-widget: al abrir el teclado se achica el contenido, así
         los botones no quedan tapados. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>KenyPets</title>

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Facebook) -->
    <meta name="description" content="Productos para tu mascota. 20% OFF en tu primera compra registrándote en la tienda." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KenyPets" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://kenypets.castrodavid9872.workers.dev/" />
    <meta property="og:title" content="KenyPets - Todo para tu mascota" />
    <meta property="og:description" content="20% OFF en tu primera compra registrándote en la tienda. Nuestros amigos primero." />
    <meta property="og:image" content="https://kenypets.castrodavid9872.workers.dev/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de KenyPets con un perro y un gato" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tiene que ser el color de lo que está más arriba en la página (el
         menú), no el color de la marca: si no, queda una franja morada
         pegada a un menú crema. -->
    <meta name="theme-color" content="#FBE4D8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
